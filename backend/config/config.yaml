server:
  port: 8080
  env: "development"
  log_level: "info"
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
    - "https://soc.company.internal"

scoring:
  weights:
    virustotal: 0.40
    abuseipdb: 0.35
    shodan: 0.25
  thresholds:
    critical: 80.0
    high: 60.0
    medium: 30.0
  default_asset_multiplier: 1.0
  asset_criticality:
    dc-01.domain.corp: 1.5
    db-prod.internal: 1.4
    payment-gw: 1.5
    corp-workstation: 1.0
    dmz-proxy: 1.1

cti:
  virustotal:
    enabled: true
    api_key: "${VIRUSTOTAL_API_KEY}"
    timeout_ms: 2500
  abuseipdb:
    enabled: true
    api_key: "${ABUSEIPDB_API_KEY}"
    timeout_ms: 2500
  shodan:
    enabled: true
    api_key: "${SHODAN_API_KEY}"
    timeout_ms: 2500

telegram:
  enabled: true
  bot_token: "${TELEGRAM_BOT_TOKEN}"
  chat_id: "${TELEGRAM_CHAT_ID}"
  alert_threshold: 60.0
